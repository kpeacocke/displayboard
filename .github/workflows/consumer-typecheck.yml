name: Type Consumer Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  external-type-check:
    name: 🧪 Type Check as Consumer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            python -m pip install "poetry==2.1.4" && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Write consumer script
        run: |
          echo "from displayboard import config, main" > consumer_check.py
          echo "reveal_type(config.SOUND_VOLUME_DEFAULT)" >> consumer_check.py
          echo "reveal_type(main.main)" >> consumer_check.py

      - name: Run mypy on consumer
        run: poetry run mypy consumer_check.py
